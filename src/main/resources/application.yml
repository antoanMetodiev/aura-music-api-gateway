spring:
  application:
    name: api-gateway

  # Loads a local, gitignored `.env` file — same mechanism as every other Aura service.
  config:
    import: "optional:file:.env[.properties]"

  cloud:
    gateway:
      server:
        webflux:
          # The gateway has no business logic and no database (Project-Info.md §10) — it only
          # forwards to the right service. One route per bounded context; add the rest here as
          # each service comes online (social, playback, library, recommendations, activity).
          routes:
            - id: catalog-svc
              uri: ${CATALOG_SVC_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/catalog/**

            - id: playback-svc
              uri: ${PLAYBACK_SVC_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/playback/**

            - id: recommendation-svc
              uri: ${RECOMMENDATION_SVC_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/recommendations/**

          globalcors:
            cors-configurations:
              "[/**]":
                allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
                allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                allowedHeaders: "*"
                allowCredentials: true
                maxAge: 3600

server:
  port: ${PORT:8080}

# Free-tier keep-alive (KeepAlivePinger). Off locally; turned on in application-prod.yml.
# Services get a liveness ping every 10 min (Render sleeps after 15 min idle); each service's full
# health, which checks its database, runs every 12 h (Supabase pauses after a week idle).
keepalive:
  enabled: ${KEEPALIVE_ENABLED:false}
  # Render sets RENDER_EXTERNAL_URL itself — pinging our own public URL keeps the gateway awake too.
  self-url: ${RENDER_EXTERNAL_URL:}
  service-urls: ${CATALOG_SVC_URL:},${PLAYBACK_SVC_URL:},${RECOMMENDATION_SVC_URL:}
  services-interval: ${KEEPALIVE_SERVICES_INTERVAL:PT10M}
  database-interval: ${KEEPALIVE_DATABASE_INTERVAL:PT12H}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

# Plain, readable console logging for local dev (IntelliJ, ./gradlew bootRun). Structured JSON logs
# live in application-prod.yml — activate with SPRING_PROFILES_ACTIVE=prod (Render deployment).
